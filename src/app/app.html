<div class="flex min-h-dvh flex-col">
  <main class="flex-1" [class.pb-20]="auth.user()">
    <router-outlet />
  </main>

  @if (auth.user()) {
    <nav
      class="fixed inset-x-0 bottom-0 z-10 flex items-center justify-around border-t border-line bg-bg-deep/95 px-2 pt-2 pb-[max(0.75rem,env(safe-area-inset-bottom))] backdrop-blur"
    >
      <a
        routerLink="/library"
        routerLinkActive="text-coral"
        class="flex flex-col items-center gap-0.5 px-4 text-[11px] font-bold text-muted"
      >
        <span class="text-lg leading-none">▤</span>
        Library
      </a>
      <a
        routerLink="/party"
        class="-mt-7 flex size-13 items-center justify-center rounded-full bg-gradient-to-br from-coral to-gold font-display text-2xl text-ink shadow-lg shadow-coral/40"
        aria-label="Start a party"
      >
        ✦
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="text-coral"
        class="flex flex-col items-center gap-0.5 px-4 text-[11px] font-bold text-muted"
      >
        <span class="text-lg leading-none">○</span>
        You
      </a>
    </nav>
  }

  <footer class="px-6 py-3 text-center text-[10px] text-muted" [class.mb-16]="auth.user()">
    This product uses the TMDB API but is not endorsed or certified by TMDB.
  </footer>
</div>
