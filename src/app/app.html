<div class="flex min-h-dvh flex-col">
  <!-- toasts (cleared of the iPhone notch/dynamic island) -->
  <div
    class="pointer-events-none fixed inset-x-0 z-30 flex flex-col items-center gap-2 px-4"
    style="top: calc(0.75rem + env(safe-area-inset-top))"
  >
    @for (t of toast.toasts(); track t.id) {
      <button
        (click)="toast.dismiss(t.id)"
        class="pointer-events-auto max-w-sm rounded-2xl border px-4 py-2.5 text-sm font-bold shadow-xl backdrop-blur"
        [class]="
          t.kind === 'error'
            ? 'border-coral/40 bg-coral/15 text-coral'
            : 'border-green/40 bg-green/15 text-green'
        "
      >
        {{ t.text }}
      </button>
    }
  </div>

  <!-- full-bleed to the top; content pads itself below the status bar -->
  <main class="flex-1 pt-[env(safe-area-inset-top)]" [class.pb-20]="auth.user()">
    <router-outlet />
  </main>

  @if (updates.updateReady()) {
    <button
      (click)="updates.applyUpdate()"
      class="fixed left-1/2 z-20 -translate-x-1/2 rounded-full bg-gradient-to-br from-coral to-gold py-2.5 pr-5 pl-4 text-sm font-bold text-ink shadow-lg shadow-coral/40"
      [class]="auth.user() ? 'bottom-24' : 'bottom-6'"
    >
      ↻ Update ready — tap to refresh
    </button>
  }

  @if (auth.user()) {
    <nav
      class="fixed inset-x-0 bottom-0 z-10 flex items-stretch border-t border-line bg-bg-deep/95 pb-[max(0.5rem,env(safe-area-inset-bottom))] backdrop-blur"
    >
      <a
        routerLink="/radar"
        routerLinkActive="!text-gold !border-gold"
        class="-mt-px flex flex-1 flex-col items-center gap-1 border-t-2 border-transparent pt-2 pb-1 text-[10px] font-bold text-muted"
      >
        <!-- radar sweep -->
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 12 L17.5 5.8" />
          <path d="M12 7a5 5 0 0 1 5 5" opacity=".5" />
          <circle cx="8.6" cy="14.8" r="1.2" fill="currentColor" stroke="none" />
        </svg>
        Radar
      </a>
      <a
        routerLink="/explore"
        routerLinkActive="!text-gold !border-gold"
        class="-mt-px flex flex-1 flex-col items-center gap-1 border-t-2 border-transparent pt-2 pb-1 text-[10px] font-bold text-muted"
      >
        <!-- magnifying glass -->
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.3 15.3 L21 21" />
        </svg>
        Explore
      </a>
      <a
        routerLink="/party"
        routerLinkActive="!text-gold !border-gold"
        class="-mt-px flex flex-1 flex-col items-center gap-1 border-t-2 border-transparent pt-2 pb-1 text-[10px] font-bold text-muted"
      >
        <!-- treasure chest -->
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19v-9a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v9z" />
          <path d="M4 12h16" />
          <path d="M12 12v2" />
          <circle cx="12" cy="15.5" r="1.3" />
        </svg>
        Quests
      </a>
      <a
        routerLink="/friends"
        routerLinkActive="!text-gold !border-gold"
        class="-mt-px flex flex-1 flex-col items-center gap-1 border-t-2 border-transparent pt-2 pb-1 text-[10px] font-bold text-muted"
      >
        <!-- two people -->
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="9" cy="8.5" r="3.2" />
          <path d="M3.5 19.5c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" />
          <circle cx="16.8" cy="9.5" r="2.5" />
          <path d="M16.5 14.4c2.4.5 4 2.6 4 5.1" />
        </svg>
        Friends
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="!text-gold !border-gold"
        class="-mt-px flex flex-1 flex-col items-center gap-1 border-t-2 border-transparent pt-2 pb-1 text-[10px] font-bold text-muted"
      >
        <!-- smiley -->
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M8.5 14.2a4.5 4.5 0 0 0 7 0" />
          <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none" />
          <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none" />
        </svg>
        Me
      </a>
    </nav>
  }

  <footer class="px-6 py-3 text-center text-[10px] text-muted" [class.mb-16]="auth.user()">
    This product uses the TMDB API but is not endorsed or certified by TMDB.
  </footer>
</div>
