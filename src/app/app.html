<div class="flex min-h-dvh flex-col">
  <!-- toasts -->
  <div class="pointer-events-none fixed inset-x-0 top-3 z-30 flex flex-col items-center gap-2 px-4">
    @for (t of toast.toasts(); track t.id) {
      <button
        (click)="toast.dismiss(t.id)"
        class="pointer-events-auto max-w-sm rounded-2xl border px-4 py-2.5 text-sm font-bold shadow-xl backdrop-blur"
        [class]="
          t.kind === 'error'
            ? 'border-coral/40 bg-coral/15 text-coral'
            : 'border-green/40 bg-green/15 text-green'
        "
      >
        {{ t.text }}
      </button>
    }
  </div>

  <main class="flex-1" [class.pb-20]="auth.user()">
    <router-outlet />
  </main>

  @if (updates.updateReady()) {
    <button
      (click)="updates.applyUpdate()"
      class="fixed left-1/2 z-20 -translate-x-1/2 rounded-full bg-gradient-to-br from-coral to-gold py-2.5 pr-5 pl-4 text-sm font-bold text-ink shadow-lg shadow-coral/40"
      [class]="auth.user() ? 'bottom-24' : 'bottom-6'"
      style="padding-bottom: calc(0.625rem + env(safe-area-inset-bottom) * 0.25)"
    >
      ↻ Update ready — tap to refresh
    </button>
  }

  @if (auth.user()) {
    <nav
      class="fixed inset-x-0 bottom-0 z-10 flex items-center justify-around border-t border-line bg-bg-deep/95 px-2 pt-2 pb-[max(0.75rem,env(safe-area-inset-bottom))] backdrop-blur"
    >
      <a
        routerLink="/radar"
        routerLinkActive="text-coral"
        class="flex flex-col items-center gap-0.5 px-3 text-[11px] font-bold text-muted"
      >
        <span class="text-lg leading-none">◉</span>
        Radar
      </a>
      <a
        routerLink="/friends"
        routerLinkActive="text-coral"
        class="flex flex-col items-center gap-0.5 px-3 text-[11px] font-bold text-muted"
      >
        <span class="text-lg leading-none">◎</span>
        Friends
      </a>
      <a
        routerLink="/party"
        class="-mt-7 flex size-13 items-center justify-center rounded-full bg-gradient-to-br from-coral to-gold font-display text-2xl text-ink shadow-lg shadow-coral/40"
        aria-label="Start a party"
      >
        ✦
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="text-coral"
        class="flex flex-col items-center gap-0.5 px-3 text-[11px] font-bold text-muted"
      >
        <span class="text-lg leading-none">○</span>
        You
      </a>
    </nav>
  }

  <footer class="px-6 py-3 text-center text-[10px] text-muted" [class.mb-16]="auth.user()">
    This product uses the TMDB API but is not endorsed or certified by TMDB.
  </footer>
</div>
